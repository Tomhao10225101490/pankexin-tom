name: Rename file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          mv pankexin-tom.html index.html
          git config user.name "Tomhao10225101490"
          git config user.email "Tomhao10225101490@users.noreply.github.com"
          git add -A
          git commit -m "Rename pankexin-tom.html to index.html"
          git push
